# pnpm-workspace.yaml
# pnpm workspace 配置：声明 packages/ 与 tools/ 下所有子目录为 workspace 包
# 注：overrides / onlyBuiltDependencies / packageExtensions 在 pnpm 10 下
# 位于 package.json#pnpm 字段（pnpm 11 才迁移到本文件，本项目用 pnpm 10）
packages:
  - 'packages/*'
  - 'tools/*'
  # 排除下划线前缀的模板目录（如 tools/_ts6-template），不作为真实 workspace 包
  - '!tools/_*'
