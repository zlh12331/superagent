# pnpm-workspace.yaml
# pnpm 11 起所有非 auth/registry 配置统一在本文件声明（不再读 package.json#pnpm）
# 参考 https://pnpm.io/settings

packages:
  - 'packages/*'
  - 'tools/*'
  # 排除下划线前缀的模板目录（如 tools/_ts6-template），不作为真实 workspace 包
  - '!tools/_*'

# ── 构建脚本决策（pnpm 11: allowBuilds 取代 onlyBuiltDependencies）────────────────
# electron 的 postinstall 会下载平台二进制，必须放行，否则运行时报
# "Electron failed to install correctly"；better-sqlite3/node-pty 需原生编译；
# esbuild 需 postinstall 安装平台二进制。其余包显式 false：@swc/core 走平台
# 可选包、@sentry/cli 二进制按需下载、msw/protobufjs/electron-winstaller 的脚本非运行必需。
# pnpm 11 对未决策包报 ERR_PNPM_IGNORED_BUILDS 阻断 install，必须逐一表态。
allowBuilds:
  better-sqlite3: true
  electron: true
  esbuild: true
  node-pty: true
  '@sentry/cli': false
  '@swc/core': false
  electron-winstaller: false
  msw: false
  protobufjs: false
  libxmljs2: true

# ── peerDependencies 补丁（pnpm 11: packageExtensions）─────────────────────────
packageExtensions:
  dependency-cruiser:
    peerDependencies:
      typescript: '*'
    peerDependenciesMeta:
      typescript:
        optional: true

# ── 依赖覆盖（pnpm 11: overrides）─────────────────────────────────────────────
overrides:
  ip-address: 10.3.1
  hono: 4.12.34
  '@hono/node-server': 1.19.15
  postcss: 8.5.23
  fast-uri: 3.1.5
  nanoid: 3.3.18
  tar: 7.5.21
  'undici@>=7.0.0': 7.29.0
  'undici@<7': 6.28.0
  'js-yaml@>=4.0.0': 4.3.1
  # Dependabot GHSA-mh99-v99m-4gvg / GHSA-rgw5-rvv9-x895：DoS，仅命中 typedoc 工具链的 4.x 线；1.x/2.x 合法共存不动
  'brace-expansion@>=4.0.0': ^5.0.9
  # Dependabot GHSA-67mh-4wv8-2f99：dev server 请求伪造，命中 drizzle-kit→@esbuild-kit 的 0.18.x
  'esbuild@<0.25.0': ^0.25.12

# ── 供应链策略 ──────────────────────────────────────────────────────────────
# pnpm 11 默认 minimumReleaseAge=1440（发布不足 24h 的包拒绝安装）。
# lockfile 内 rolldown/tanstack 等当日新版本会被误拦，项目用 npmmirror 镜像
# + lockfile 版本锁定，供应链风险已受控，故显式关闭该 age gate。
minimumReleaseAge: 0

# ── 存储与缓存：固定到项目内（TRAE 沙箱不允许写系统根目录 F:\.pnpm-store）───
storeDir: .pnpm-store
