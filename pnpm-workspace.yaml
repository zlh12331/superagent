# pnpm-workspace.yaml
# pnpm 11 起所有非 auth/registry 配置统一在本文件声明（不再读 package.json#pnpm）
# 参考 https://pnpm.io/settings

packages:
  - 'packages/*'
  - 'tools/*'
  # 排除下划线前缀的模板目录（如 tools/_ts6-template），不作为真实 workspace 包
  - '!tools/_*'

# ── 构建脚本决策（pnpm 11: allowBuilds 取代 onlyBuiltDependencies）────────────────
# electron 的 postinstall 会下载平台二进制，必须放行，否则运行时报
# "Electron failed to install correctly"；better-sqlite3/node-pty 需原生编译；
# esbuild 需 postinstall 安装平台二进制。其余包显式 false：@swc/core 走平台
# 可选包、@sentry/cli 二进制按需下载、msw/protobufjs/electron-winstaller 的脚本非运行必需。
# pnpm 11 对未决策包报 ERR_PNPM_IGNORED_BUILDS 阻断 install，必须逐一表态。
allowBuilds:
  better-sqlite3: true
  electron: true
  esbuild: true
  node-pty: true
  '@sentry/cli': false
  '@swc/core': false
  electron-winstaller: false
  msw: false
  protobufjs: false
  libxmljs2: true

# ── peerDependencies 补丁（pnpm 11: packageExtensions）─────────────────────────
packageExtensions:
  dependency-cruiser:
    peerDependencies:
      typescript: '*'
    peerDependenciesMeta:
      typescript:
        optional: true

# ── 依赖覆盖（pnpm 11: overrides）─────────────────────────────────────────────
overrides:
  ip-address: 10.3.1
  # 2026-09-09 升级：4.12.34 → 4.13.7（CVE-2026-84363/84364/84365 系列 query/parseBody DoS，patched 4.13.5）
  'hono@>=4.0.0': 4.13.7
  '@hono/node-server': 1.19.15
  postcss: 8.5.23
  # 2026-09-04 升级：3.1.5 → 3.1.6（CVE-2026-75899/75931/75975 系列 SSRF 修复版）
  # GHSA-fph4-wmhf-6fwf / GHSA-5jgf-p345-68v8 / GHSA-f65p-4m7j-42xc / GHSA-jqff-g426-hqxp
  fast-uri: 3.1.6
  nanoid: 3.3.18
  tar: 7.5.21
  'undici@>=7.0.0': 7.29.0
  'undici@<7': 6.28.0
  # 2026-09-09 升级：4.3.1 → 4.3.2（CVE-2026-84375 maxTotalMergeKeys 空合并源 CPU 耗尽，patched 4.3.2）
  'js-yaml@>=4.0.0': 4.3.2
  # Dependabot GHSA-mh99-v99m-4gvg / GHSA-rgw5-rvv9-x895：DoS，仅命中 typedoc 工具链的 4.x 线；1.x/2.x 合法共存不动
  'brace-expansion@>=4.0.0': ^5.0.9
  # Dependabot GHSA-67mh-4wv8-2f99：dev server 请求伪造，命中 drizzle-kit→@esbuild-kit 的 0.18.x
  'esbuild@<0.25.0': ^0.25.12

# ── 供应链策略 ──────────────────────────────────────────────────────────────
# 发布年龄闸（supply-chain age gate）：拒绝安装「发布不足 24h」的包版本。
#
# 2026-09-11 由 0 改回 1440（= pnpm 11 默认值）。此前关闭的理由是「当日新版本会被
# 误拦，镜像 + lockfile 已受控」——该理由**不成立**：
#   1. 本闸防的不是「新版本不稳定」，而是**依赖投毒**（恶意版本发布后数分钟内
#      被 CI/开发者装走，是 npm 生态近年最主要的攻击面）；
#   2. 「lockfile 锁定」防不住**新依赖首次加入**那一刻（pnpm add 必然取最新版）；
#   3. 旧注释把风险性质写成了「稳定性」，掩盖了真实的安全含义。
# 代价：新增/升级依赖时，若目标版本发布不足 24h 会被拦——这是**有意的**，
# 通常等一天或改用已过期的版本即可。确需立即安装时按需临时豁免（见下）。
#
# 临时豁免方式（不要改本文件）：`pnpm install --config.minimumReleaseAge=0`
minimumReleaseAge: 1440

# ── 存储与缓存：固定到项目内（TRAE 沙箱不允许写系统根目录 F:\.pnpm-store）───
storeDir: .pnpm-store
