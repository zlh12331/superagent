# sentry.properties
# sentry-cli 配置（符号上传用）
# 文档：https://docs.sentry.io/product/cli/configuration/
#
# 认证令牌通过环境变量 SENTRY_AUTH_TOKEN 传入（不硬编码到文件）
# 生成方式：Sentry UI → Settings → API Keys → Create New Token
# 需要权限：project:releases（用于 --release 关联）、org:read

defaults.url=http://127.0.0.1:9000
defaults.org=sentry
defaults.project=electron
