name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Typecheck (tsc -b)
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Build site
        run: npm run build

      - name: Install MotionLens dependencies
        working-directory: capture
        run: npm ci

      - name: MotionLens unit tests
        working-directory: capture
        run: npm test
