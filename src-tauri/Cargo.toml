# cargo-shear 无法看到平台相关的 openssl-sys 使用，
# 故在此静默误报，而非删除真实依赖。
[workspace.metadata.cargo-shear]
ignored = [
    "icu_provider",
    "openssl-sys",
]

# ============================================================
# Profiles — codex-rs 的 profile 作为 workspace 默认
# ============================================================

[profile.dev]
# 保留行表/回溯，同时避免本地 dev 构建中昂贵的完整变量调试信息。
debug = "limited"

[profile.dev-small]
inherits = "dev"
opt-level = 0
debug = "none"
strip = "symbols"

[profile.release]
lto = "thin"
debug = "line-tables-only"
split-debuginfo = "off"
# 在打包归档 sidecar 符号并 strip 二进制之前，
# 保持 release 二进制可符号化。
strip = false

# 平衡并行 release 代码生成与二进制体积。
codegen-units = 4

# codex-desktop per-package override：覆盖为 Tauri 应用优化（最小体积）
# 注意：lto 不可 per-package 覆盖，接受 workspace 的 "thin"
[profile.release.package.codex-desktop]
opt-level = "s"
codegen-units = 1
strip = true

[profile.profiling]
inherits = "release"
debug = "full"
lto = false
strip = false

[profile.ci-test]
# Reduce binary size to reduce disk pressure.
debug = "limited"
inherits = "test"
opt-level = 0

# ============================================================
# Patches — 合并 codex-rs 的 patch
#
# v8 OVERRIDE 已修正（2026-07-11）：
# OpenAI fork 不只修改 happy-eyeballs 内部逻辑，还添加了
# tungstenite::extensions 模块、DeflateConfig、ExtensionsConfig 等公开 API。
# codex-api 编译期依赖这些 API，因此 patch 必须保留，不可删除。
# ============================================================

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

# 调试本地改动时取消注释。
