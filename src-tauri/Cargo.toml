# ============================================================
# Codex Desktop — Cargo workspace 根
#
# 本文件是纯 workspace 清单，不包含任何 package 定义。
# 所有 crate（桌面端 + 引擎）统一放在 codex-rs/ 下。
#
# - [workspace] members 包含 codex-rs/ 下的 100 个 crate
# - [workspace.dependencies] 统一管理依赖版本
# - [workspace.lints] 定义全局 clippy 规则
# ============================================================

