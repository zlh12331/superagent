<!doctype html>
<html lang="zh-CN" style="background:#0A0A0A">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>(function(){try{var t=localStorage.getItem('code-agent:theme');if(t!=='light'&&t!=='dark'&&t!=='system'){t='dark'}var dark=t==='dark'||(t==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);var d=document.documentElement;if(dark){d.classList.add('dark');}else{d.classList.remove('dark');}d.style.removeProperty('background');}catch{document.documentElement.style.removeProperty('background');}})();</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Code Agent Desktop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
