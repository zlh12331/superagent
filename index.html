<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      content="#080B10"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#F7F8FA"
      media="(prefers-color-scheme: light)"
    />
    <title>Codex Desktop</title>

    <!--
      Fonts: Bricolage Grotesque (sans) + Instrument Serif (serif) + Martian Mono (mono)
      与 prototype.html 行 11-12 对齐，加载全部 3 个字体族。
      Tauri 打包时应子集化内嵌字体（保留 Bricolage + Martian Mono + Instrument Serif）。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 预加载字体样式表：对齐 prototype.html 行 11，提前发起请求以减少首屏字体闪烁 -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Instrument+Serif:ital@0;1&family=Martian+Mono:wght@400;500;600;700&display=swap"
      as="style"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Instrument+Serif:ital@0;1&family=Martian+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // 内联阻塞脚本：在首次绘制前应用主题 class，以避免 FOUC（Flash of Unstyled Content，无样式内容闪烁）。
      // 此处逻辑与 src/lib/theme.ts 中的 applyThemeClass() 保持一致，修改时必须同步更新，避免两处实现出现差异。
      ;(function () {
        try {
          var theme = localStorage.getItem('ui-theme') || 'system'
          var isDark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.classList.remove('light', 'dark')
          root.classList.add(isDark ? 'dark' : 'light')
        } catch (_) {
          // If localStorage is unavailable (rare), default to light
          document.documentElement.classList.add('light')
        }
      })()
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
