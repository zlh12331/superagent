# .github/workflows/release.yml
# CD 流水线：Release PR 合并后 → 三平台构建 → **CI + CD 全绿后才打 tag + 发布**
#
# 触发（2026-09-10 重构）：Release PR（release-please 生成）合并产生的 push（main/beta）。
# 流程：
#   0. gate job：识别本次 push 是否 release-please 的发布提交，提取版本号（非发布 push → 全部跳过）
#   1. CD 三平台矩阵构建（windows/macos/linux，各自跑 release gate + 平台打包）与
#      ci-check job（等待独立 ci.yml 在同一 commit 上跑完）**并行**
#   2. release job（needs: gate+build+ci-check）：**CI 通过 且** 三平台构建全部成功后
#      才打 tag → 创建 draft Release
#   3. publish job（needs: release）：校验三平台安装包 + latest*.yml 齐全 → draft 转正式
#
# 关键语义（与用户确认）：CI 与 CD 同时跑，两者都没问题（CI 绿 + 三平台构建成功）
# 才发版——任一方失败则无 tag 无 release，版本号（由 Release PR 写入
# package.json/CHANGELOG）不占号、可重试。
#
# 所需 Secrets：
# - SENTRY_AUTH_TOKEN：Sentry CLI 认证 token
# - 代码签名（可选）：CSC_LINK + CSC_KEY_PASSWORD（Windows/macOS 签名；无证书时自动跳过签名）

name: Release

on:
  push:
    branches: [main, beta]
  workflow_dispatch: # 手动重放/重试：gate 直接取 package.json 版本视为发布

permissions:
  contents: write

jobs:
  # ── gate：仅 release-please 的发布提交（或手动 dispatch）才继续 ──
  gate:
    name: Gate (release-please commit?)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is_release: ${{ steps.detect.outputs.is_release }}
      version: ${{ steps.detect.outputs.version }}
      prerelease: ${{ steps.detect.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect release-please commit
        id: detect
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # 手动重试：以当前 package.json 版本为准（发布流程刚失败时可重新放行）
            VERSION=$(node -p "require('./package.json').version")
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            if [[ "$VERSION" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          MSG=$(git log -1 --format=%s)
          echo "HEAD commit: $MSG"
          if [[ "$MSG" =~ ^chore\((main|beta)\):\ release[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?) ]]; then
            VERSION="${BASH_REMATCH[2]}"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            if [[ "$VERSION" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build & Release ${{ matrix.platform }}
    needs: gate
    if: needs.gate.outputs.is_release == 'true'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      # P5 修复：Sentry token 提升到 job 级 env——步骤级 env 对自身 if 不可见
      # （GitHub Actions 在 if 求值时尚未注入步骤 env），此前 if 恒为 false、
      # 符号上传从未执行。job 级 env 可被后续步骤的 if 正常读取。
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runs-on: windows-latest
            build-cmd: pnpm build:win
            release-files: |
              release/*-setup.exe
              release/latest.yml
          - platform: macOS
            runs-on: macos-latest
            build-cmd: pnpm build:mac
            release-files: |
              release/*.dmg
              release/*.zip
              release/latest-mac.yml
          - platform: Linux
            runs-on: ubuntu-latest
            build-cmd: pnpm build:linux
            release-files: |
              release/*.AppImage
              release/*.deb
              release/latest-linux.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史（changelog 等）

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── SBOM 生成（供应链合规：CycloneDX 物料清单，随 release 归档）───────
      # 2026-09-04 供应链加固：发布构建产物附 SBOM，供审计/合规/漏洞联动。
      # cdxgen（Node 实现免 Java）从 pnpm lockfile 生成；各平台独立命名防 matrix
      # 覆盖；release job 的 Collect 步骤统一收集 sbom-*.cdx.json。
      - name: Generate SBOM (CycloneDX)
        shell: bash
        run: |
          mkdir -p release
          pnpm sbom:generate
          cp bom.json release/sbom-${{ matrix.platform }}.cdx.json

      # Linux 构建依赖：AppImage 打包需要 libfuse2（ubuntu-24.04 默认不装）
      - name: Install Linux build dependencies
        if: matrix.platform == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      # ── Release Gate：全部门禁通过才打包 ────────────────────────────
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # ── 平台打包 ───────────────────────────────────────────────────
      - name: Build & package ${{ matrix.platform }} installer
        # macOS 签名令牌的"空值注入"坑（2026-09-10 实测定位）：
        # 把 secrets.CSC_LINK 直接放进 env:，secret 未配置时会以**空字符串**注入进程环境；
        # electron-builder 按 `env.CSC_LINK != null` 判定"配置了证书"→ 用空密码去 stat
        # 空路径（≈项目根）→ "not a file" 失败（macOS 主发端必踩）。
        # 修法：secret 先进中间变量 ORIG_CSC_*（空串无意义），bash 中仅当非空才
        # 导出真实的 CSC_LINK/CSC_KEY_PASSWORD——没有证书时 electron-builder 进程
        # 环境里 CSC_LINK **彻底不存在**（而非空串），配合关闭身份自发现 → 干净跳过签名。
        shell: bash
        env:
          ORIG_CSC_LINK: ${{ secrets.CSC_LINK }}
          ORIG_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # electron-builder 自动发布控制（手动上传，故不自动 publish）
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # C1 修复：与 ci.yml 对齐——CI checkout 无记忆引擎上游（resources/memory-hub
          # 不入仓），不设此变量 prepare-memory-hub 会 exit(1) 中断 && 链，三平台全部失败
          MEMORY_HUB_OPTIONAL: '1'
        run: |
          if [ -n "${ORIG_CSC_LINK:-}" ]; then
            export CSC_LINK="$ORIG_CSC_LINK"
            export CSC_KEY_PASSWORD="$ORIG_CSC_KEY_PASSWORD"
          fi
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          ${{ matrix.build-cmd }}

      # 更新源已切 provider: github（electron-builder.yml publish），
      # 占位 feed guard 随之移除；GitHub Release 资产即更新源。
      # ── 上传 Sentry 符号（仅 Windows 主发布端；其余平台产物不含符号需求）─
      # P5 修复：
      # - 步骤 if 改用 job 级 env（此前步骤级 env 对自身 if 不可见，恒跳过）
      # - 明确只放行 Windows leg（此前注释如此宣称但条件未限制平台）
      # - 上传前先创建 release（此前 CI 从未调用 release:new，上传会 404）
      # C3 修复：release 名剥 tag 的 v 前缀（code-agent@1.0.0），与运行时
      # app.getVersion() 及本地 sentry-release.mjs 对齐——Sentry release 是精确
      # 字符串匹配，此前 tag 带 v 而运行时无 v，符号化永远不命中
      - name: Compute Sentry release name
        if: env.SENTRY_AUTH_TOKEN != '' && matrix.platform == 'Windows'
        shell: bash
        run: echo "SENTRY_RELEASE=code-agent@${{ needs.gate.outputs.version }}" >> "$GITHUB_ENV"

      - name: Create Sentry release
        if: env.SENTRY_AUTH_TOKEN != '' && matrix.platform == 'Windows'
        run: pnpm sentry-cli releases new "$SENTRY_RELEASE"

      - name: Upload Sentry symbols
        if: env.SENTRY_AUTH_TOKEN != '' && matrix.platform == 'Windows'
        run: |
          pnpm sentry-cli sourcemaps upload --release "$SENTRY_RELEASE" --org sentry --project electron --url-prefix "app:///out/" ./out
          pnpm sentry-cli sourcemaps upload --release "$SENTRY_RELEASE" --org sentry --project electron --url-prefix "app:///renderer/" ./out/renderer
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # ── 生产产物 smoke 测试（验证打包后 binary 可启动）──────────────
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production smoke tests
        # Linux 无头环境走 xvfb（Electron 启动需要 Display）
        run: ${{ matrix.platform == 'Linux' && 'xvfb-run -a pnpm test:smoke' || 'pnpm test:smoke' }}

      # ── 上传构建产物（release job 合并）──────────────────────────────
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ github.ref_name }}
          path: release/
          retention-days: 30

  # ── ci-check：等待独立 CI 工作流（ci.yml）在同一 commit 上通过 ──────
  # 用户确认（2026-09-10）：CI 与 CD（三平台构建）**并行**跑，但打 tag/建 Release
  # 之前必须两者都绿。本 job 与 build 同时启动（都只依赖 gate），轮询 GitHub API
  # 直到本 commit 的 CI workflow 出结论；CI 非 success → 本 job 失败 → release 被跳过。
  ci-check:
    name: Wait for CI workflow green
    needs: gate
    if: needs.gate.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      conclusion: ${{ steps.wait.outputs.conclusion }}
    steps:
      # CI 可能刚被 push 触发、瞬间尚无 workflow run：轮询直到出现并完成。
      - name: Wait for CI (ci.yml) on this commit
        id: wait
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          for i in $(seq 1 85); do
            RUN=$(gh api "/repos/$REPO/actions/runs?head_sha=$SHA&per_page=30" \
              --jq '[.workflow_runs[] | select(.name == "CI" and .event == "push")][0]' 2>/dev/null \
              || true)
            if [ -n "$RUN" ] && [ "$RUN" != "null" ]; then
              STATUS=$(printf '%s' "$RUN" | jq -r .status)
              CONCLUSION=$(printf '%s' "$RUN" | jq -r .conclusion)
              if [ "$STATUS" = "completed" ]; then
                echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"
                if [ "$CONCLUSION" = "success" ]; then
                  echo "CI workflow green on $SHA"
                  exit 0
                fi
                echo "::error::CI workflow 未通过（conclusion=$CONCLUSION），不发版"
                exit 1
              fi
            fi
            echo "CI not completed yet (attempt $i/85), waiting 20s..."
            sleep 20
          done
          echo "::error::等待 CI workflow 超时（85 次 * 20s ≈ 28min）"
          exit 1

  release:
    name: Create GitHub Release (tag + draft)
    needs: [gate, build, ci-check]
    if: needs.gate.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      # 提取发布描述需要 CHANGELOG.md（release job 此前无 checkout）
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 合并三平台产物到统一目录（避免文件名冲突覆盖）
      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.exe" -o -name "*.yml" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.blockmap" -o -name "sbom-*.cdx.json" \) -exec cp -n {} release/ \;
          ls -la release/

      # 发布描述取自 CHANGELOG.md 中对应版本的段落（发版前在 Release PR 中润色好的文案）
      - name: Extract release body from CHANGELOG
        shell: bash
        run: |
          VERSION="${{ needs.gate.outputs.version }}"
          VERSION_ESCAPED=$(printf '%s' "$VERSION" | sed 's/\./\\./g')
          awk -v v="$VERSION_ESCAPED" '
            /^## / {
              if ($0 ~ ("^## \\[" v "\\]") || $0 ~ ("^## " v " \\(")) { inbody = 1; next }
              if (inbody) exit
            }
            inbody { print }
          ' CHANGELOG.md > release-body.md
          # 匹配失败时兜底：仍创建一个非空描述，避免 Release 文案为空
          if [ ! -s release-body.md ]; then
            echo "## Release $VERSION" > release-body.md
          fi

      # 此处已处于「三平台构建全部成功」之后：tag 在这里创建（softprops 在 tag 不存在时
      # 自动打 tag），即"构建成功才打 tag/占号"。draft 对用户不可见，由 publish 校验后转正。
      - name: Create GitHub Release (tag + draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.gate.outputs.version }}
          body-path: release-body.md # 使用润色后的 CHANGELOG 版本段，而非机器生成的 release notes
          files: release/**
          draft: true # 电源包与元数据齐备前对外不可见；由下方 publish job 校验后转正式
          prerelease: ${{ needs.gate.outputs.prerelease }} # beta 等含 '-' 版本标记为 prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 发布转正式（2026-09-09 流程加固）────────────────────────────
  # 「打 tag」只代表代码快照 + 构建成功；对用户可见的发布必须连安装包一起。
  # 本 job 校验三平台安装包 + latest*.yml 元数据齐全后才把草稿转正式（draft=false），
  # 缺任一项即失败保持草稿 → 用户永远看不到"空版本"。失败后 rerun build job 即可。
  publish:
    name: Publish Release (assets verified)
    needs: [gate, release]
    if: needs.gate.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Verify all platform assets & promote draft to public
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.gate.outputs.version }}"
          REPO="${{ github.repository }}"
          if ! ASSETS=$(gh api "/repos/$REPO/releases/tags/$TAG" --jq '.assets[].name' 2>/dev/null); then
            echo "::error::找不到 tag=$TAG 的 draft release（release job 是否跳过？）"
            exit 1
          fi
          echo "release assets:"; echo "$ASSETS"
          MISSING=0
          for req in "latest.yml" "latest-mac.yml" "latest-linux.yml"; do
            if ! grep -qx "$req" <<<"$ASSETS"; then echo "::error::缺少更新元数据: $req"; MISSING=1; fi
          done
          for glob in "Code Agent Desktop-*.exe" "Code Agent Desktop-*.dmg" "Code Agent Desktop-*.AppImage"; do
            re=$(printf '%s' "$glob" | sed 's/[.+^$(){}\[\]\\-]/\\&/g; s/\*/.*/g')
            if ! grep -Eq "$re" <<<"$ASSETS"; then echo "::error::缺少安装包: $glob"; MISSING=1; fi
          done
          if [ "$MISSING" = "1" ]; then
            echo "::error::安装包未齐，保持草稿不发布。修复后 rerun 对应 build job 再重跑本 job。"
            exit 1
          fi
          gh release edit "$TAG" --repo "$REPO" --draft=false
          gh release view "$TAG" --repo "$REPO" --json url --jq '"✅ 已正式发布: " + .url'
