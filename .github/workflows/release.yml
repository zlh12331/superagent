# .github/workflows/release.yml
# CD 流水线：tag 触发自动构建三端安装包（Windows/macOS/Linux）+ 上传 Sentry 符号 + 创建 GitHub Release
#
# 触发：推送 v*.*.* 格式 git tag（如 v0.1.0）
# 流程：
#   1. 三平台矩阵构建（windows/macos/linux，各自跑 release gate + 平台打包）
#   2. release job（needs: build）：合并三平台产物 → GitHub Release
#
# 所需 Secrets：
# - SENTRY_AUTH_TOKEN：Sentry CLI 认证 token
# - 代码签名（可选）：CSC_LINK + CSC_KEY_PASSWORD（Windows/macOS 签名；无证书时自动跳过签名）

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: # 支持手动触发

jobs:
  build:
    name: Build & Release ${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      # P5 修复：Sentry token 提升到 job 级 env——步骤级 env 对自身 if 不可见
      # （GitHub Actions 在 if 求值时尚未注入步骤 env），此前 if 恒为 false、
      # 符号上传从未执行。job 级 env 可被后续步骤的 if 正常读取。
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runs-on: windows-latest
            build-cmd: pnpm build:win
            release-files: |
              release/*-setup.exe
              release/latest.yml
          - platform: macOS
            runs-on: macos-latest
            build-cmd: pnpm build:mac
            release-files: |
              release/*.dmg
              release/*.zip
              release/latest-mac.yml
          - platform: Linux
            runs-on: ubuntu-latest
            build-cmd: pnpm build:linux
            release-files: |
              release/*.AppImage
              release/*.deb
              release/latest-linux.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史（changelog 等）

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── SBOM 生成（供应链合规：CycloneDX 物料清单，随 release 归档）───────
      # 2026-09-04 供应链加固：发布构建产物附 SBOM，供审计/合规/漏洞联动。
      # cdxgen（Node 实现免 Java）从 pnpm lockfile 生成；各平台独立命名防 matrix
      # 覆盖；release job 的 Collect 步骤统一收集 sbom-*.cdx.json。
      - name: Generate SBOM (CycloneDX)
        shell: bash
        run: |
          mkdir -p release
          pnpm sbom:generate
          cp bom.json release/sbom-${{ matrix.platform }}.cdx.json

      # Linux 构建依赖：AppImage 打包需要 libfuse2（ubuntu-24.04 默认不装）
      - name: Install Linux build dependencies
        if: matrix.platform == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      # ── Release Gate：全部门禁通过才打包 ────────────────────────────
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # ── 平台打包 ───────────────────────────────────────────────────
      - name: Build & package ${{ matrix.platform }} installer
        run: ${{ matrix.build-cmd }}
        env:
          # 代码签名证书（可选）：Windows Authenticode / macOS Developer ID
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # electron-builder 自动发布控制（手动上传，故不自动 publish）
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # C1 修复：与 ci.yml 对齐——CI checkout 无记忆引擎上游（resources/memory-hub
          # 不入仓），不设此变量 prepare-memory-hub 会 exit(1) 中断 && 链，三平台全部失败
          MEMORY_HUB_OPTIONAL: '1'

      # 硬门禁（2026-09-06 审计修复）：此前只 echo warning，占位 feed 会被静默发版。
      # 出厂包更新源指向 example.com = 自动更新永远失败（且域名被抢注即供应链风险）。
      # 确需临时发版：设 ALLOW_PLACEHOLDER_FEED=1 显式豁免（有痕）。
      - name: "Guard: update feed must not be a placeholder"
        shell: bash
        env:
          ALLOW_PLACEHOLDER_FEED: ${{ vars.ALLOW_PLACEHOLDER_FEED }}
        run: |
          if grep -q 'code-agent\.example\.com' electron-builder.yml; then
            echo "::error::electron-builder.yml 的 publish.url 仍是占位域名——出厂包自动更新会失败。"
            echo "::error::请替换为真实 HTTPS 源（或改用 provider: github）后重新发版。"
            if [ "$ALLOW_PLACEHOLDER_FEED" != "1" ]; then
              exit 1
            fi
            echo "::warning::ALLOW_PLACEHOLDER_FEED=1，已豁免本次发版。"
          fi

      # ── 上传 Sentry 符号（仅 Windows 主发布端；其余平台产物不含符号需求）─
      # P5 修复：
      # - 步骤 if 改用 job 级 env（此前步骤级 env 对自身 if 不可见，恒跳过）
      # - 明确只放行 Windows leg（此前注释如此宣称但条件未限制平台）
      # - 上传前先创建 release（此前 CI 从未调用 release:new，上传会 404）
      # C3 修复：release 名剥 tag 的 v 前缀（code-agent@1.0.0），与运行时
      # app.getVersion() 及本地 sentry-release.mjs 对齐——Sentry release 是精确
      # 字符串匹配，此前 tag 带 v 而运行时无 v，符号化永远不命中
      - name: Compute Sentry release name
        if: env.SENTRY_AUTH_TOKEN != '' && matrix.platform == 'Windows'
        shell: bash
        run: echo "SENTRY_RELEASE=code-agent@${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Create Sentry release
        if: env.SENTRY_AUTH_TOKEN != '' && matrix.platform == 'Windows'
        run: pnpm sentry-cli releases new "$SENTRY_RELEASE"

      - name: Upload Sentry symbols
        if: env.SENTRY_AUTH_TOKEN != '' && matrix.platform == 'Windows'
        run: |
          pnpm sentry-cli sourcemaps upload --release "$SENTRY_RELEASE" --org sentry --project electron --url-prefix "app:///out/" ./out
          pnpm sentry-cli sourcemaps upload --release "$SENTRY_RELEASE" --org sentry --project electron --url-prefix "app:///renderer/" ./out/renderer
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # ── 生产产物 smoke 测试（验证打包后 binary 可启动）──────────────
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production smoke tests
        run: pnpm test:smoke

      # ── 上传构建产物（release job 合并）──────────────────────────────
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ github.ref_name }}
          path: release/
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 合并三平台产物到统一目录（避免文件名冲突覆盖）
      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.exe" -o -name "*.yml" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.blockmap" -o -name "sbom-*.cdx.json" \) -exec cp -n {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true # 自动由 commits 生成 changelog
          files: release/**
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }} # v0.1.0-beta1 等标记为 prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
