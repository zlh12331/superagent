# .github/workflows/release.yml
# CD 流水线：Release PR 合并后 → 三平台构建 → **构建全部成功才打 tag + 发布**
#
# 触发：Release PR（release-please 生成）合并产生的 push（main），或 workflow_dispatch 手动重放。
# 流程：
#   0. gate job：识别本次 push 是否 release-please 的发布提交，提取版本号（非发布 push → 全部跳过）
#   1. CD 三平台矩阵构建（windows/macos/linux，各自原生单测 + 打包 + 产物 smoke）
#   2. release job（needs: gate+build）：三平台构建全部成功后才打 tag → 创建 draft Release
#   3. publish job（needs: release）：校验三平台安装包 + latest*.yml 齐全 → draft 转正式
#
# 关键语义（2026-09-10 方案二：CI on PR, CD on main）：
#   本工作流**不再等待/轮询独立 ci.yml 的 push 运行**（旧 `ci-check` job 已删除）。
#   依据：仓库 ruleset 强制 main 所有提交必须走 PR、禁用管理员绕过、
#   strict_required_status_checks_policy=true（PR 必须含 main 最新提交）、
#   required_linear_history（只允许 squash/rebase ⇒ 合入树与 PR head 一致）
#   ⇒ release 提交在合并前必然已通过 CI 全量门禁，此处再轮询一遍属重复劳动。
#   任一方构建失败则无 tag 无 release，版本号不占号、可重试。
#
# 所需 Secrets：
# - 代码签名（可选）：CSC_LINK + CSC_KEY_PASSWORD（Windows/macOS 签名；无证书时自动跳过签名）

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # 防误触发（2026-09-10 收口）：手动重放必须显式确认版本，
      # 且须与 package.json 当前版本一致，gate 校验不符即拒绝。
      confirm_version:
        description: 待构建/补发验证的版本号（必须与 package.json 版本一致）
        required: true
        type: string

permissions:
  contents: write

# 防快速连推时叠加：同一分支的 release 运行串行化。
# cancel-in-progress 必须为 false——正在构建/发布的运行被取消会留下半成品
# （tag 已打、资产未齐的中间态），宁可排队等前一个跑完。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── gate：仅 release-please 的发布提交（或手动 dispatch）才继续 ──
  gate:
    name: Gate (release-please commit?)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is_release: ${{ steps.detect.outputs.is_release }}
      version: ${{ steps.detect.outputs.version }}
      prerelease: ${{ steps.detect.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect release-please commit
        id: detect
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # 手动重试（2026-09-10 收口）：必须显式输入与 package.json 一致的版本号，
            # 防止误点 dispatch 直接发版。输入不符 → gate 失败 → 全部 job 跳过。
            VERSION=$(node -p "require('./package.json').version")
            CONFIRM="${{ github.event.inputs.confirm_version }}"
            if [[ -z "$CONFIRM" || "$CONFIRM" != "$VERSION" ]]; then
              echo "::error::confirm_version='$CONFIRM' 与 package.json 版本 '$VERSION' 不一致，拒绝放行"
              exit 1
            fi
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            if [[ "$VERSION" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          MSG=$(git log -1 --format=%s)
          echo "HEAD commit: $MSG"
          if [[ "$MSG" =~ ^chore\((main|beta)\):\ release[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?) ]]; then
            VERSION="${BASH_REMATCH[2]}"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            if [[ "$VERSION" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build & Release ${{ matrix.platform }}
    needs: gate
    if: needs.gate.outputs.is_release == 'true'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runs-on: windows-latest
            build-cmd: pnpm build:win
            release-files: |
              release/*-setup.exe
              release/latest.yml
          - platform: macOS
            runs-on: macos-latest
            build-cmd: pnpm build:mac
            release-files: |
              release/*.dmg
              release/*.zip
              release/latest-mac.yml
          - platform: Linux
            runs-on: ubuntu-latest
            build-cmd: pnpm build:linux
            release-files: |
              release/*.AppImage
              release/*.deb
              release/latest-linux.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史（changelog 等）

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── SBOM 生成（供应链合规：CycloneDX 物料清单，随 release 归档）───────
      # 2026-09-04 供应链加固：发布构建产物附 SBOM，供审计/合规/漏洞联动。
      # cdxgen（Node 实现免 Java）从 pnpm lockfile 生成；各平台独立命名防 matrix
      # 覆盖；release job 的 Collect 步骤统一收集 sbom-*.cdx.json。
      - name: Generate SBOM (CycloneDX)
        shell: bash
        run: |
          mkdir -p release
          pnpm sbom:generate
          cp bom.json release/sbom-${{ matrix.platform }}.cdx.json

      # Linux 构建依赖：AppImage 打包需要 libfuse2（ubuntu-24.04 默认不装）
      - name: Install Linux build dependencies
        if: matrix.platform == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      # ── 原生单测（保留；2026-09-10 方案二复核）────────────────────────
      # 为什么保留：PR CI 的 quality job 只跑在 ubuntu，**mac/win 的原生单测没有其它
      # 环节覆盖**——而单测恰是最易暴露平台差异的一层（路径分隔符、原生模块
      # better-sqlite3/node-pty、safeStorage 的 DPAPI/Keychain/libsecret 分支）。
      # 发布是最后一道闸，故各平台打包前先跑自己的原生单测。
      # 为什么 typecheck / lint 不在此重跑：二者与平台无关（同一份源码在三个平台结论
      # 相同），PR CI 的 ubuntu quality job 已覆盖；释放出 2 步 × 3 平台 = 6 次重复执行。
      # Windows 只跑 main/renderer/scripts：node-pty/ConPTY 与 vitest fork worker 并发会
      # 崩（0xC0000005 ACCESS_VIOLATION），该集成层本就不在 Windows 覆盖范围
      # （集成测试只在 ubuntu 的 CI job 跑）。
      - name: Unit tests (${{ matrix.platform }})
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "Windows" ]; then
            pnpm test:main && pnpm test:renderer && pnpm test:scripts
          else
            pnpm test
          fi

      # ── 平台打包 ───────────────────────────────────────────────────
      - name: Build & package ${{ matrix.platform }} installer
        # macOS 签名令牌的"空值注入"坑（2026-09-10 实测定位）：
        # 把 secrets.CSC_LINK 直接放进 env:，secret 未配置时会以**空字符串**注入进程环境；
        # electron-builder 按 `env.CSC_LINK != null` 判定"配置了证书"→ 用空密码去 stat
        # 空路径（≈项目根）→ "not a file" 失败（macOS 主发端必踩）。
        # 修法：secret 先进中间变量 ORIG_CSC_*（空串无意义），bash 中仅当非空才
        # 导出真实的 CSC_LINK/CSC_KEY_PASSWORD——没有证书时 electron-builder 进程
        # 环境里 CSC_LINK **彻底不存在**（而非空串），配合关闭身份自发现 → 干净跳过签名。
        #
        # 公证（notarize）凭据同理：electron-builder 的 getNotarizeOptions 按
        # APPLE_* 环境变量判定，未配置则 warn 跳过（不会失败）。这里只在整套凭据
        # 齐备时导出，避免"配了一半"触发 InvalidConfigurationError。
        # 优先 App Store Connect API Key（APPLE_API_* 三件套）；未配置则回退
        # Apple ID 模式（APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID）。
        shell: bash
        env:
          ORIG_CSC_LINK: ${{ secrets.CSC_LINK }}
          ORIG_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          ORIG_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          ORIG_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ORIG_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ORIG_APPLE_ID: ${{ secrets.APPLE_ID }}
          ORIG_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          ORIG_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # electron-builder 自动发布控制（手动上传，故不自动 publish）
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${ORIG_CSC_LINK:-}" ]; then
            export CSC_LINK="$ORIG_CSC_LINK"
            export CSC_KEY_PASSWORD="$ORIG_CSC_KEY_PASSWORD"
          fi
          # 公证凭据：三件套齐备才导出（缺一则整套不导出 → 干净跳过公证）
          if [ -n "${ORIG_APPLE_API_KEY:-}" ] && [ -n "${ORIG_APPLE_API_KEY_ID:-}" ] && [ -n "${ORIG_APPLE_API_ISSUER:-}" ]; then
            export APPLE_API_KEY="$ORIG_APPLE_API_KEY"
            export APPLE_API_KEY_ID="$ORIG_APPLE_API_KEY_ID"
            export APPLE_API_ISSUER="$ORIG_APPLE_API_ISSUER"
            echo "公证：使用 App Store Connect API Key"
          elif [ -n "${ORIG_APPLE_ID:-}" ] && [ -n "${ORIG_APPLE_APP_SPECIFIC_PASSWORD:-}" ] && [ -n "${ORIG_APPLE_TEAM_ID:-}" ]; then
            export APPLE_ID="$ORIG_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$ORIG_APPLE_APP_SPECIFIC_PASSWORD"
            export APPLE_TEAM_ID="$ORIG_APPLE_TEAM_ID"
            echo "公证：使用 Apple ID 模式"
          else
            echo "公证：未配置凭据，跳过（electron-builder 会 warn）"
          fi
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          ${{ matrix.build-cmd }}

      # 更新源已切 provider: github（electron-builder.yml publish），
      # 占位 feed guard 随之移除；GitHub Release 资产即更新源。
      # 注：Sentry 符号上传步骤已于 2026-09-13 随 Sentry 移除整体删除
      # （本地优先错误处理，报障走 GitHub issue + 诊断包，见 error-report.ts）。

      # ── 安装包引擎断言（防"发布缺引擎的包"事故复发）──────────────
      # 2026-09-12 事故：引擎源码未入仓 → CI 生成占位目录并 exit 0 → 打包"成功"
      # 但产物不含引擎（运行时静默降级），而 README 承诺了该功能。
      # 本步在打包后校验最终产物内的 resources/memory-hub 真有可运行引擎
      # （入口 + node_modules + 无占位标记 + 关键依赖），缺任一即失败。
      - name: Verify packaged memory engine
        run: pnpm check:packaged-engine

      # ── 生产产物 smoke 测试（验证打包后 binary 可启动）──────────────
      # 不下载 Chromium（2026-09-10 优化）：smoke.prod.spec.ts 用 _electron.launch 驱动
      # 打包产物，无需 Playwright 自带浏览器；ffmpeg 供 video:'retain-on-failure' 录像。
      # 本步此前占 207s（三平台各一次），是 build job 的单项大头。
      - name: Install Playwright deps (ffmpeg only, no Chromium)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then pnpm exec playwright install-deps chromium; fi
          pnpm exec playwright install ffmpeg

      - name: Run production smoke tests
        # Linux 无头环境走 xvfb（Electron 启动需要 Display）
        run: ${{ matrix.platform == 'Linux' && 'xvfb-run -a pnpm test:smoke' || 'pnpm test:smoke' }}

      # ── 上传构建产物（release job 合并）──────────────────────────────
      # 2026-09-10 资产规范化：只上传 release/ 根目录的安装包 + 更新元数据 + SBOM，
      # 不再整个 release/（否则 win-unpacked/linux-unpacked 内 node.exe/rg.exe/
      # OpenConsole/winpty-agent 等杂项与 app-update.yml 一并混入 GitHub Release）。
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ github.ref_name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap
            release/sbom-*.cdx.json
          retention-days: 30

  release:
    name: Create GitHub Release (tag + draft)
    needs: [gate, build]
    if: needs.gate.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      # 提取发布描述需要 CHANGELOG.md（release job 此前无 checkout）
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 合并三平台产物到统一目录（避免文件名冲突覆盖）。
      # 2026-09-10 资产规范化：安装包用 命名白名单 收集（产品名-平台-架构连字符名），
      # 与 electron-builder.yml artifactName 一致；CBOM/更新元数据/blockmap 一并收集。
      # 不再用 *.exe/*.yml 通配——那会把 win-unpacked 杂项（node.exe 等）混入。
      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts \( -type f \) \( \
            -name "Code-Agent-Desktop-Windows-*.exe" -o \
            -name "Code-Agent-Desktop-macOS-*.dmg" -o \
            -name "Code-Agent-Desktop-macOS-*.zip" -o \
            -name "Code-Agent-Desktop-Linux-*.AppImage" -o \
            -name "Code-Agent-Desktop-Linux-*.deb" -o \
            -name "latest*.yml" -o \
            -name "*.blockmap" -o \
            -name "sbom-*.cdx.json" \
          \) -exec cp -n {} release/ \;
          ls -la release/

      # 发布描述取自 CHANGELOG.md 中对应版本的段落（发版前在 Release PR 中润色好的文案）
      - name: Extract release body from CHANGELOG
        shell: bash
        run: |
          VERSION="${{ needs.gate.outputs.version }}"
          VERSION_ESCAPED=$(printf '%s' "$VERSION" | sed 's/\./\\./g')
          awk -v v="$VERSION_ESCAPED" '
            /^## / {
              if ($0 ~ ("^## \\[" v "\\]") || $0 ~ ("^## " v " \\(")) { inbody = 1; next }
              if (inbody) exit
            }
            inbody { print }
          ' CHANGELOG.md > release-body.md
          # 匹配失败时兜底：仍创建一个非空描述，避免 Release 文案为空
          if [ ! -s release-body.md ]; then
            echo "## Release $VERSION" > release-body.md
          fi

      # 此处已处于「三平台构建全部成功」之后：tag 在这里创建（softprops 在 tag 不存在时
      # 自动打 tag），即"构建成功才打 tag/占号"。draft 对用户不可见，由 publish 校验后转正。
      - name: Create GitHub Release (tag + draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.gate.outputs.version }}
          body_path: release-body.md # 使用润色后的 CHANGELOG 版本段，而非机器生成的 release notes（v2 参数名是 body_path）
          files: release/**
          draft: true # 电源包与元数据齐备前对外不可见；由下方 publish job 校验后转正式
          prerelease: ${{ needs.gate.outputs.prerelease }} # beta 等含 '-' 版本标记为 prerelease
        env:
          # token 选择（2026-09-10 实测定位）：normal 发布路径下 softprops 走 **create**，
          # 用 GITHUB_TOKEN 即可（内置 bot 创建 release，后续资产上传同身份，全链路无 403）。
          # 不要改回 RELEASE_PLEASE_TOKEN：对**已存在**的 release（由用户 PAT 创建）做 update
          # 时，GITHUB_TOKEN 与 fine-grained PAT 均会 403 "Resource not accessible by
          # integration"（User PAT 创建的 release，Actions 身份无权修改）。
          # 补发/重放已存在 tag 的场景（如历史空壳 v1.0.5）使用 gh CLI 手动处理。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 发布转正式（2026-09-09 流程加固）────────────────────────────
  # 「打 tag」只代表代码快照 + 构建成功；对用户可见的发布必须连安装包一起。
  # 本 job 校验三平台安装包 + latest*.yml 元数据齐全后才把草稿转正式（draft=false），
  # 缺任一项即失败保持草稿 → 用户永远看不到"空版本"。失败后 rerun build job 即可。
  publish:
    name: Publish Release (assets verified)
    needs: [gate, release]
    if: needs.gate.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Verify all platform assets & promote draft to public
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.gate.outputs.version }}"
          REPO="${{ github.repository }}"
          # draft release 不响应 /releases/tags/{tag}（GitHub 对 draft 返回 404，2026-09-10
          # 实测：create 成功后 publish 因此误报"找不到 draft release"）。改用 releases
          # 列表按 tag 匹配拿 release_id，后续查资产/转正式全部走 id。
          # 注：gh api 的 --jq 不接受 --arg（纯 jq CLI 参数），直接用字符串内插表达式。
          RELEASE_ID=$(gh api "/repos/$REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" 2>/dev/null | head -n 1)
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "::error::找不到 tag=$TAG 的 draft release（release job 是否成功创建？）"
            exit 1
          fi
          ASSETS=$(gh api "/repos/$REPO/releases/$RELEASE_ID" --jq '.assets[].name')
          echo "release #$RELEASE_ID assets:"; echo "$ASSETS"
          MISSING=0
          for req in "latest.yml" "latest-mac.yml" "latest-linux.yml"; do
            if ! grep -qx "$req" <<<"$ASSETS"; then echo "::error::缺少更新元数据: $req"; MISSING=1; fi
          done
          # 主安装包按 产品名-平台-架构 命名前缀校验（与 electron-builder.yml artifactName、
          # Collect 白名单对齐）。2026-09-10 资产规范化后全为连字符命名，
          # 不再依赖空格名（GitHub asset 名曾把空格转点导致精确 glob 失配）。
          if ! grep -Eq 'Code-Agent-Desktop-Windows-.*\.exe($|\.blockmap$)' <<<"$ASSETS"; then echo "::error::缺少 Windows 安装包 (*Windows-*.exe)"; MISSING=1; fi
          if ! grep -Eq 'Code-Agent-Desktop-macOS-.*\.dmg($|\.blockmap$)' <<<"$ASSETS"; then echo "::error::缺少 macOS 安装包 (*macOS-*.dmg)"; MISSING=1; fi
          if ! grep -Eq 'Code-Agent-Desktop-Linux-.*\.AppImage($|\.blockmap$)' <<<"$ASSETS"; then echo "::error::缺少 Linux 安装包 (*Linux-*.AppImage)"; MISSING=1; fi
          if [ "$MISSING" = "1" ]; then
            echo "::error::安装包未齐，保持草稿不发布。修复后 rerun 对应 build job 再重跑本 job。"
            exit 1
          fi
          gh api -X PATCH "/repos/$REPO/releases/$RELEASE_ID" -f draft=false >/dev/null
          gh api "/repos/$REPO/releases/$RELEASE_ID" \
            --jq '"✅ 已正式发布: " + .html_url'
