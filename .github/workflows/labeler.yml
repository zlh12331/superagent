# PR 按改动路径自动打区域标签
# 配置：.github/labeler.yml（v5 语法，changed-files any-glob-to-any-file）
# 权限：pull-requests: write（labeler 需要写 label）
# 安全：action pin 到 commit SHA（防 tag 重指）

name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # SHA 对应 actions/labeler v5（8558fd74291d67161a8a78ce36a881fa63b766a9）
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9
