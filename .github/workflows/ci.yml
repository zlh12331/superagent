# .github/workflows/ci.yml
# CI 流水线：push / PR 触发，跑全部质量门禁 + 测试矩阵（三平台）
#
# 设计：
# - quality job：跑在 ubuntu-latest，快速反馈 typecheck/lint/unit test/audit
# - e2e-electron job：三平台矩阵（windows/ubuntu/macos），跑真实 Electron E2E
# - e2e-smoke-prod job：windows + ubuntu 矩阵，跑生产构建 smoke 测试
# - package job：三平台 electron-builder 打包验证（当前平台原生构建）
#
# 参考项目 electron-shadcn-main/.github/workflows/testing.yaml 的 job 分层模式

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # 允许手动触发（便于调试）

# 同分支并行时取消旧 run（节省 CI 时间）
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: 质量门禁（快速反馈）────────────────────────────
  quality:
    name: Typecheck / Lint / Unit Test / Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # gitleaks 扫描 base^..head 区间：浅克隆会让区间无提交 → "0 leaks" 假绿
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Static checks (tokens + i18n)
        run: pnpm check:static

      - name: Token consistency (Style Dictionary)
        run: pnpm tokens:check

      - name: Dead code check (knip)
        run: pnpm knip

      - name: Dependency direction (depcruise)
        run: pnpm depcruise

      - name: Schema drift check (drizzle-kit)
        # 防 schema.ts 与 drizzle/ 迁移快照漂移（数据层单一真源一致性）。
        # 2026-09-08 修复：此前只跑 `drizzle-kit check`，实测它只校验迁移快照链
        # 自身（版本/父子 id），**从不读 schema.ts**——改了 schema 忘 generate
        # 时 CI 依旧全绿。现在用 generate + git diff 做真实漂移检测。
        run: |
          pnpm exec drizzle-kit generate
          if ! git diff --quiet -- drizzle/; then
            echo "::error::schema.ts 与 drizzle/ 迁移不同步——请提交 pnpm exec drizzle-kit generate 的产物"
            git diff --stat -- drizzle/
            exit 1
          fi
          pnpm exec drizzle-kit check

      - name: Unit tests + coverage gate (shared + main + renderer)
        run: pnpm test:coverage

      - name: Gate scripts self-test
        # 守卫门禁自身的测试（棘轮/覆盖率真源/文件度量等 9 个文件）——
        # 此前只在本地 pre-push 跑，CI 不跑等于门禁自己没人看（2026-09-06 审计修复）
        run: pnpm test:scripts

      - name: Dependency audit
        # audit-ci + .nsprc 白名单（2026-08-30 收紧为卡关；本地已验证 0 命中）
        run: pnpm run audit

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: |
            packages/shared/coverage/
            src/main/coverage/
            src/renderer/coverage/
          retention-days: 7

  # ── Job 2: 集成测试（慢速分层门控，不阻塞单测高频反馈）──
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Integration tests (tests/integration)
        run: pnpm test:integration

  # ── Job 3: 浏览器 E2E（dev server，轻量级）─────────────────
  e2e-browser:
    name: E2E (Browser Mode)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser E2E tests (journey 套件偶发 flaky 用 retries 吸收)
        run: pnpm exec playwright test --config e2e/playwright.config.ts --retries=2

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-browser-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

  # ── Job 3: Electron E2E（真实窗口，三平台矩阵）─────────────
  e2e-electron:
    name: E2E (Electron Mode, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 三平台真实 Electron 窗口验证（macOS 验证 mac 专属路径，Linux 验证 libsecret 降级路径）
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron binary
        run: node node_modules/electron/install.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build dev artifacts
        run: pnpm build

      - name: Bundle size gate
        run: pnpm check:bundle

      - name: React Compiler gate
        # 防静默失效：oxc-transform-react（可选 peerDep）缺失时 compiler 选项无效且无报错
        run: pnpm check:compiler

      - name: Run Electron E2E tests
        # Linux 无头环境需要 xvfb（GitHub ubuntu runner 预装 Xvfb）
        run: pnpm test:e2e:electron
        env:
          # macOS 沙箱冲突时允许开发模式启动（测试专用）
          ELECTRON_DISABLE_SANDBOX: ${{ runner.os == 'Linux' && '1' || '' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-electron-${{ matrix.os }}-${{ github.run_id }}
          path: playwright-report-electron/
          retention-days: 7

  # ── Job 4: 生产构建 Smoke 测试（最接近用户场景，win + linux）─
  smoke-prod:
    name: Smoke (Production Build, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows：NSIS；Linux：AppImage（macOS smoke 由 package job 覆盖）
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build production artifacts
        # CI 无上游 MemoryCore 源码（不入仓，registry 只有 1.0.0-beta.1）：
        # 显式打包无记忆引擎产物，运行时自动降级空实现（release.yml 已同步设置此变量）
        run: pnpm build:${{ runner.os == 'Windows' && 'win' || 'linux' }}
        env:
          MEMORY_HUB_OPTIONAL: '1'

      - name: Run production smoke tests
        run: pnpm test:smoke
        env:
          ELECTRON_DISABLE_SANDBOX: ${{ runner.os == 'Linux' && '1' || '' }}

      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke-${{ matrix.os }}-${{ github.run_id }}
          path: playwright-report-smoke/
          retention-days: 7

  # ── Job 5: 三平台打包验证（当前平台原生构建）───────────────
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron binary
        run: node node_modules/electron/install.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + package
        # macos runner 需签名工具（跳过：未提供证书时 electron-builder 自动跳过）
        # CI 无上游 MemoryCore 源码（不入仓，registry 只有 1.0.0-beta.1）：
        # 显式打包无记忆引擎产物，运行时自动降级空实现（release.yml 已同步设置此变量）
        run: pnpm build:${{ runner.os == 'Windows' && 'win' || runner.os == 'macOS' && 'mac' || 'linux' }}
        env:
          MEMORY_HUB_OPTIONAL: '1'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ github.run_id }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/latest*.yml
          retention-days: 7
          if-no-files-found: warn
