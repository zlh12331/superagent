# .github/workflows/release-please.yml
# 版本管理自动化（release-please）：接管「版本号推导 + CHANGELOG 生成」。
#
# 流程（2026-09-10 重构，tag 后置）：
#   1. main / beta 分支每次 push 触发；release-please 基于 Conventional Commits 计算下一个版本，
#      自动创建/更新「release-please-releases」Release PR（内含 package.json 版本号 + CHANGELOG）
#   2. 人工审阅后合并 Release PR → **不打 tag**（skip-tag: true）。
#      tag 由 release.yml 在**三平台构建全部成功之后**才打（见 release.yml 头注释）——
#      保证「安装包没生成好绝不发版/占号」。
#
# 预览版（beta）：
#   - beta 分支是 release-please 默认识别的 prerelease 分支：合并其 Release PR 会把
#     版本号定为 vX.Y.Z-beta.N，release.yml 按版本含 '-' 自动标记 GitHub Prerelease。
#   - beta 分支从 main 拉出并持续向前合并 main；正式版回流（beta→main）走普通 PR 审阅。
#
# 关键约束：
# - 打 tag 移交给 release.yml，故本 workflow 不再需要触发其他 workflow 的权限要求；
#   为避免 GitHub 对 GITHUB_TOKEN 打 tag 的递归限制，tag 由 release.yml 用 GITHUB_TOKEN
#   在构建成功后创建（本 workflow 不创建 tag）。
# - 与 ci.yml 并发冲突：Release PR 合并触发的 push 会同时跑 ci.yml 与 release.yml。

name: Release Please

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: node
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-tag: true # 合并后不打 tag——由 release.yml 构建成功后打（防空版本占号）