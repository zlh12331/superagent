# .github/workflows/release-please.yml
# 版本管理自动化（release-please）：接管「版本号推导 + CHANGELOG 生成」。
#
# 流程（2026-09-10 重构，tag 后置）：
#   1. main 分支每次 push 触发；release-please 基于 Conventional Commits 计算下一个版本，
#      自动创建/更新「release-please-releases」Release PR（内含 package.json 版本号 + CHANGELOG）
#   2. 人工审阅后合并 Release PR → **release-please 不打 tag、不建 Release**
#      （skip-github-release: true，见下）。
#      tag 由 release.yml 在**三平台构建全部成功之后**才打（见 release.yml 头注释）——
#      保证「安装包没生成好绝不发版/占号」。
#
#   ⚠️ 2026-09-10 修正：此前写的是 `skip-tag: true`，**该输入在
#   googleapis/release-please-action@v4 中并不存在**（合法输入是
#   skip-github-release / skip-github-pull-request / skip-labeling）。
#   Actions 对未知输入静默忽略 ⇒ release-please 一直在合并 Release PR 时
#   自行打 tag + 建空 Release，于是 release.yml 的 release 步骤落入「更新既有
#   release」路径，被 GitHub 以 403（update-a-release / Resource not accessible
#   by integration）拒绝——这正是历次发版 CD 全红、且「空壳 tag 占号」的真正根因。
#
# 预发布版（beta）——单分支 + prerelease 版本化策略（2026-10-06 重设计）：
#   - 本仓库**只用 main 一条发布分支**，不发长期 beta 分支。prerelease 由
#     release-please-config.json 的 `versioning: "prerelease"` + `prerelease: true`
#     + `prerelease-type: "beta"` 驱动（release-please **不会**按分支名识别 prerelease）：
#     beta 阶段的 fix/feat 提交自动递增 prerelease 号（1.7.0-beta.1 → 1.7.0-beta.2）。
#   - ⚠️ **本 workflow 禁止传 release-type 输入**：release-please-action 收到
#     release-type 会走 Manifest.fromConfig 分支——配置文件整个被绕过、versioning
#     落到输入默认值 default。此前配置因此形同虚设（含中文 changelog 分组），beta
#     序列只能靠 Release-As footer 逐个硬指定（实测：fix 提交在 1.7.0-beta.1 后
#     天然提案 1.7.1-beta.1，2026-10-06 修复）。
#   - `Release-As: X.Y.Z` footer 保留两个用途：显式钉版本（跨系列收敛/跳号）与
#     毕业为正式版（`Release-As: 1.7.0`——prerelease: true 常开时策略永不收敛
#     beta 后缀，普通提交只会继续递增 beta.N）。
#
# 关键约束：
# - 打 tag 移交给 release.yml，故本 workflow 不再需要触发其他 workflow 的权限要求；
#   为避免 GitHub 对 GITHUB_TOKEN 打 tag 的递归限制，tag 由 release.yml 用 GITHUB_TOKEN
#   在构建成功后创建（本 workflow 不创建 tag）。
# - 与 ci.yml 并发冲突：Release PR 合并触发的 push 会同时跑 ci.yml 与 release.yml。

name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# release-please 每次运行都是基于当前仓库状态重新计算（幂等），
# 故快速连推时取消旧运行是安全的。
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # ⚠️ 不要加 release-type 输入：会让 action 绕过 release-please-config.json
          # 走 fromConfig 分支（见文件头「预发布版」节）。配置文件里已有 release-type: node。
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # 合并后不打 tag、不建 Release——由 release.yml 三平台构建成功后打（防空版本占号）。
          # 注意：必须是 skip-github-release，不是 skip-tag（后者非法、会被静默忽略）。
          skip-github-release: true