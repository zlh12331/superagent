# Ideas 版块开帖表单（Discussion category form）
# 文件名必须等于版块 slug（ideas）；对齐 39 号 spec §6「已记录话术」的意图：
# 开帖时即引导查重与"要解决的问题"表述，减少无效提案
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议。请说明**要解决的问题**，而不只是想要的实现方式——
        问题清楚了，方案才有讨论的基础。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你现在遇到的困难或不便是？为什么现有能力不够？
      placeholder: 我在做 … 的时候，无法 …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 可选——你希望它怎么工作
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 试过的替代方案
      description: 可选——用过的变通办法及为什么不够
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue 与 Discussions，未发现重复建议
          required: true
