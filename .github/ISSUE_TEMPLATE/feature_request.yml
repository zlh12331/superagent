name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议。请说明**要解决的问题**，而不只是想要的实现方式。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你现在遇到的困难或不便是？为什么现有能力不够？
      placeholder: 我在做 … 的时候，无法 …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作？（可选，但有助于理解）
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你试过哪些变通做法？为什么不行？
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，未发现重复建议
          required: true
